<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Personal homepage of Gyeongrak Choe">
    <title>Gyeongrak Choe</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script>
        // 화면이 그려지기 전에 테마 지정 (깜빡임 방지): 저장된 선택 > 시스템 설정
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('theme'); } catch (e) {}
            var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        })();
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

    </svg>

    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
    </button>

    <div id="modal" class="modal" aria-hidden="true">
        <span class="modal-close" aria-label="Close">&times;</span>
        <img class="modal-content" id="modal-img" alt="">
    </div>

    <div class="page">
        <header class="profile">
            <div class="profile-text">
                <h1 id="name"></h1>
                <p class="position" id="position"></p>
                <p class="profile-links" id="profile-links"></p>
            </div>
            <div class="profile-photo">
                <img id="photo" alt="Profile photo">
            </div>
        </header>

        <div class="bio" id="bio"></div>

        <section class="block" id="news">
            <h2>News</h2>
            <ul id="news-list"></ul>
            <button type="button" id="news-toggle" hidden>Show more &#9660;</button>
        </section>

        <section class="block" id="publications">
            <h2>Publications</h2>
            <p class="subnote" id="pub-note"></p>
            <div class="item-list" id="pub-list"></div>
        </section>

        <section class="block" id="projects">
            <h2>Projects</h2>
            <div class="item-list" id="project-list"></div>
        </section>

        <section class="block" id="education">
            <h2>Education</h2>
            <div id="edu-list"></div>
        </section>
    </div>

    <footer>
        <p>Last updated: <span id="last-updated"></span></p>
    </footer>

    <script src="content.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
